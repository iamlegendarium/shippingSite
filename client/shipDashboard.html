<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shipment Dashboard</title>
    <link
      href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/shipDashboard.css" />
  </head>
  <body>
    <div class="container-fluid">
      <div class="row">
        <!-- Sidebar -->
        <nav class="col-md-2 d-none d-md-block bg-primary sidebar">
          <div class="sidebar-sticky">
            <ul class="nav flex-column">
              <li class="nav-item">
                <a class="nav-link active text-white" href="#">
                  <img
                    src="./img/logo24.svg"
                    alt="Ship24"
                    class="img-fluid mb-3"
                  />
                </a>
              </li>
              <li class="nav-item">
                <a class="nav-link text-white" href="dashboard.html">Home</a>
              </li>
              <li class="nav-item">
                <a class="nav-link text-white" href="shipDashboard.html">Shipment Dashboard</a>
              </li>
              <li class="nav-item">
                <a class="nav-link text-white" href="#">Tracking History</a>
              </li>
              <li class="nav-item">
                <a class="nav-link text-white" href="#">Transaction History</a>
              </li>
              <li class="nav-item">
                <a class="nav-link text-white" href="#">Settings</a>
              </li>
              <li class="nav-item">
                <a class="nav-link text-white" href="#">Log Out</a>
              </li>
              <li class="nav-item mt-4">
                <button class="btn btn-light w-100">Upgrade plan</button>
              </li>
            </ul>
          </div>
        </nav>

        <!-- Main Content -->
        <main role="main" class="col-md-10 ml-sm-auto col-lg-10 px-4">
          <h1 class="mt-4">Shipment Dashboard</h1>
          <div class="table-responsive">
            <table class="table table-striped table-sm">
              <thead>
                <tr>
                  <th>Tracking Number</th>
                  <th>Origin</th>
                  <th>Destination</th>
                  <th>Status</th>
                  <th>Sender Name</th>
                  <th>Receiver Name</th>
                  <th>Receiver Address</th>
                </tr>
              </thead>
              <tbody id="shipmentTableBody">
                <!-- Shipment data will be populated here -->
              </tbody>
            </table>
          </div>
        </main>
      </div>
    </div>
    <script src="shipdashboard.js"></script>
