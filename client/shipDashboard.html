<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shipment Dashboard</title>
    <link
      href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/shipDashboard.css" />
    <style>
      /* Mobile Responsive Styles */
      @media (max-width: 768px) {
        .sidebar {
          position: fixed;
          top: 0;
          left: -100%;
          width: 250px;
          height: 100vh;
          z-index: 1000;
          transition: left 0.3s ease;
        }
        
        .sidebar.show {
          left: 0;
        }
        
        .mobile-menu-btn {
          position: fixed;
          top: 15px;
          left: 15px;
          z-index: 1001;
          background: #007bff;
          border: none;
          color: white;
          padding: 8px 12px;
          border-radius: 4px;
          cursor: pointer;
        }
        
        .mobile-menu-overlay {
          position: fixed;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          background: rgba(0,0,0,0.5);
          z-index: 999;
          display: none;
        }
        
        .mobile-menu-overlay.show {
          display: block;
        }
        
        main {
          margin-left: 0 !important;
          padding: 60px 15px 15px 15px !important;
        }
        
        .table-responsive {
          font-size: 14px;
        }
        
        .table td, .table th {
          padding: 8px 4px;
        }
      }
      
      @media (max-width: 576px) {
        .table-responsive {
          font-size: 12px;
        }
        
        h1 {
          font-size: 24px;
          margin-top: 10px !important;
        }
        
        .table td, .table th {
          padding: 6px 2px;
        }
      }
      
      /* Desktop Styles */
      .sidebar {
        min-height: 100vh;
        box-shadow: 2px 0 5px rgba(0,0,0,0.1);
      }
      
      main {
        transition: margin-left 0.3s ease;
      }
    </style>
  </head>
  <body>
    <!-- Mobile Menu Button -->
    <button class="mobile-menu-btn d-md-none">☰ Menu</button>
    
    <!-- Mobile Overlay -->
    <div class="mobile-menu-overlay" id="mobileOverlay"></div>
    
    <div class="container-fluid">
      <div class="row">
        <!-- Sidebar -->
        <nav class="col-md-2 bg-primary sidebar" id="sidebar">
          <div class="sidebar-sticky">
            <ul class="nav flex-column">
              <li class="nav-item">
                <a class="nav-link active text-white" href="#">
                  <img
                    src="./img/logo24.png"
                    alt="BAP"
                    class="img-fluid mb-3"
                  />
                </a>
              </li>
              <li class="nav-item">
                <a class="nav-link text-white" href="dashboard.html">Home</a>
              </li>
              <li class="nav-item">
                <a class="nav-link text-white" href="shipDashboard.html"
                  >Shipment Dashboard</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link text-white" href="#">Settings</a>
              </li>
              <li class="nav-item">
                <a class="nav-link text-white logout-btn" href="#">Log out</a>
              </li>
              <li class="nav-item mt-4">
              </li>
            </ul>
          </div>
        </nav>

        <main role="main" class="col-md-10 ml-sm-auto col-lg-10 px-4">
          <h1 class="mt-4">Shipment Dashboard</h1>
          <div class="table-responsive">
            <table class="table table-striped table-sm">
              <thead>
                <tr>
                  <th>Tracking Number</th>
                  <th>Origin</th>
                  <th>Destination</th>
                  <th>Status</th>
                  <th>Sender Name</th>
                  <th>Receiver Name</th>
                  <th>Receiver Address</th>
                </tr>
              </thead>
              <tbody id="shipmentTableBody">
                <!-- Shipment data will be populated here -->
              </tbody>
            </table>
          </div>
        </main>
      </div>
    </div>
<script src="config.js"></script>
    <script src="shipdashboard.js"></script>
    <script>
      // Mobile menu functionality
      document.addEventListener("DOMContentLoaded", function () {
        const mobileMenuBtn = document.querySelector('.mobile-menu-btn');
        const sidebar = document.getElementById('sidebar');
        const mobileOverlay = document.getElementById('mobileOverlay');
        
        // Toggle mobile menu
        mobileMenuBtn.addEventListener('click', function() {
          sidebar.classList.toggle('show');
          mobileOverlay.classList.toggle('show');
        });
        
        // Close menu when overlay is clicked
        mobileOverlay.addEventListener('click', function() {
          sidebar.classList.remove('show');
          mobileOverlay.classList.remove('show');
        });
        
        // Close menu when a nav link is clicked (on mobile)
        const navLinks = document.querySelectorAll('.nav-link');
        navLinks.forEach(link => {
          link.addEventListener('click', function() {
            if (window.innerWidth < 768) {
              sidebar.classList.remove('show');
              mobileOverlay.classList.remove('show');
            }
          });
        });

        // Logout functionality
        const logoutLinks = document.querySelectorAll('.logout-btn');
        
        logoutLinks.forEach(link => {
          link.addEventListener('click', function (e) {
            e.preventDefault();

            // Clear authentication data from localStorage
            localStorage.removeItem("authToken");
            localStorage.removeItem("user");

            // Redirect to main index.html page
            window.location.href = "index.html";
          });
        });
        
        // Handle window resize
        window.addEventListener('resize', function() {
          if (window.innerWidth >= 768) {
            sidebar.classList.remove('show');
            mobileOverlay.classList.remove('show');
          }
        });
      });
      
    </script>
  </body>
</html>
